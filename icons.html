<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选择钢笔尖图标</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", -apple-system, sans-serif;
      background: #f2f1ec; color: #222; padding: 32px 20px;
    }
    h1 { text-align: center; font-size: 22px; margin-bottom: 6px; letter-spacing: -0.02em; }
    p.sub { text-align: center; color: #777; font-size: 13.5px; margin-bottom: 26px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; max-width: 920px; margin: 0 auto; }
    .card {
      background: #fff; border: 1px solid #e5e3db; border-radius: 14px;
      padding: 18px 12px 14px; text-align: center; cursor: pointer;
      transition: all .2s;
    }
    .card:active { transform: scale(.97); }
    .card img { width: 72px; height: 72px; display: block; margin: 0 auto 12px; border-radius: 10px; }
    .card .n { font-size: 13px; font-weight: 600; }
    .card .t { font-size: 12px; color: #888; margin-top: 3px; }
    .tip { max-width: 560px; margin: 26px auto 0; text-align: center; font-size: 13px; color: #666; line-height: 1.7; }
    .tip b { color: #111; }
  </style>
</head>
<body>
  <h1>选择钢笔尖图标</h1>
  <p class="sub">点击编号，记住你喜欢的那个告诉我（如"选 1 号"）</p>
  <div class="grid">
    <div class="card"><img src="candidate-icons/usericon.svg" alt=""><div class="n">你发的</div><div class="t">原图标直用</div></div>
    <div class="card"><img src="candidate-icons/pen1.svg" alt=""><div class="n">1</div><div class="t">经典还原</div></div>
    <div class="card"><img src="candidate-icons/pen2.svg" alt=""><div class="n">2</div><div class="t">流线弧面</div></div>
    <div class="card"><img src="candidate-icons/pen3.svg" alt=""><div class="n">3</div><div class="t">修长苗条</div></div>
    <div class="card"><img src="candidate-icons/pen4.svg" alt=""><div class="n">4</div><div class="t">宽胖敦实</div></div>
    <div class="card"><img src="candidate-icons/pen5.svg" alt=""><div class="n">5</div><div class="t">尖锋长剑</div></div>
    <div class="card"><img src="candidate-icons/pen6.svg" alt=""><div class="n">6</div><div class="t">圆润底部</div></div>
    <div class="card"><img src="candidate-icons/pen7.svg" alt=""><div class="n">7</div><div class="t">弧线刻痕</div></div>
    <div class="card"><img src="candidate-icons/pen8.svg" alt=""><div class="n">8</div><div class="t">菱形气孔</div></div>
  </div>
  <div class="tip">选好后告诉我编号，我就替换掉当前的钢笔尖。想看其它风格（更细/更粗/加圆头等）也可以说。</div>
</body>
</html>
